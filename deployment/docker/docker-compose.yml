version: '3.8'

services:
  # ATTENDO Web Application
  attendo-app:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: attendo-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=docker
      - DATABASE_URL=postgresql://attendo:password@db:5432/attendo_db
      - SECRET_KEY=${SECRET_KEY:-hackathon-attendo-secret-key}
    volumes:
      - attendo_uploads:/app/uploads
      - attendo_reports:/app/reports
      - attendo_logs:/app/logs
    depends_on:
      - db
      - redis
    networks:
      - attendo-network
    restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: attendo-db
    environment:
      - POSTGRES_DB=attendo_db
      - POSTGRES_USER=attendo
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - attendo-network
    restart: unless-stopped

  # Redis for Caching and Session Management
  redis:
    image: redis:7-alpine
    container_name: attendo-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - attendo-network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: attendo-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
    depends_on:
      - attendo-app
    networks:
      - attendo-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  attendo_uploads:
    driver: local
  attendo_reports:
    driver: local
  attendo_logs:
    driver: local

networks:
  attendo-network:
    driver: bridge
